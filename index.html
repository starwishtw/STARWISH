<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STARWISH 星途如願｜生咖訂製下單</title>
<style>
:root{--bg:#FFFCF7;--card:#FFF1F3;--ink:#3A4060;--brand:#4B64A8;--brand-ink:#FFFCF7;--line:#DCE1F0;--mute:#6B7191;--pink:#F4BFCB;--yellow:#FFF1C7;--blue-soft:#E4EAF8;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1B1D2B;--card:#262A3D;--ink:#EEF0F8;--brand:#A9BCF0;--brand-ink:#1B1D2B;--line:#3A3F58;--mute:#A3A9C4;--yellow:#4A4228;--blue-soft:#303652}}
:root[data-theme="dark"]{--bg:#1B1D2B;--card:#262A3D;--ink:#EEF0F8;--brand:#A9BCF0;--brand-ink:#1B1D2B;--line:#3A3F58;--mute:#A3A9C4;--yellow:#4A4228;--blue-soft:#303652}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:24px 16px 120px}
h1{font-size:28px;margin:8px 0 4px;color:var(--brand)}
.sub{color:var(--mute);margin:0 0 20px}
section{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}
h2{font-size:18px;margin:0 0 12px;color:var(--brand)}
.step{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--pink);color:#3A4060;font-weight:700;font-size:14px;margin-right:8px}
label{display:block;font-size:14px;margin:10px 0 4px}
input[type=text],input[type=date],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.grid{grid-template-columns:1fr}}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px dashed var(--line)}
.item:first-of-type{border-top:0}
.name{font-weight:600}.price{font-size:13px;color:var(--mute)}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--brand);background:var(--blue-soft);color:var(--brand);font-size:18px;cursor:pointer}
.qty input{width:64px;text-align:center;padding:6px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.logo{display:block;width:min(240px,70%);margin:0 auto 12px;border-radius:24px;border:4px solid var(--pink)}
h1,.sub{text-align:center}
.base{background:var(--yellow);border-radius:12px;padding:10px 12px;margin-top:14px}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.chk input{margin-top:6px;accent-color:var(--brand)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--brand);color:var(--brand-ink);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-between;align-items:center;gap:12px;z-index:5}
.bar b{font-size:20px}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--brand-ink);color:var(--brand);font:inherit;font-weight:700;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:6px 0;border-top:1px dashed var(--line)}td:last-child{text-align:right}
.tot td{font-weight:700;font-size:16px}
.note{font-size:13px;color:var(--mute)}
.ord{padding:10px 0;border-top:1px dashed var(--line)}.ord .note{white-space:pre-line;margin:4px 0 0}
textarea.out{min-height:200px;margin-top:10px;font-size:13px}
h3{font-size:15px;margin:14px 0 4px}
.svc{border-top:1px dashed var(--line);padding:6px 0}.svc:first-of-type{border-top:0}
.opts{margin:0 0 8px 28px}.opts[hidden]{display:none}
fieldset{border:0;padding:0;margin:8px 0}legend{font-size:13px;color:var(--mute);padding:0}
.chip{display:inline-block;margin:4px 12px 4px 0;font-size:14px;cursor:pointer}
.chip input,.chk input{accent-color:var(--brand)}
</style>
</head>

  <h1>STARWISH 星途如願</h1>
  <p class="sub">生咖一條龍訂製下單：選好應援物、佈置物與設計需求，我們再與你確認細節。</p>

  <section>
    <h2><span class="step">1</span>活動資訊</h2>
    <div class="grid">
      <div><label for="idol">偶像／角色名稱</label><input type="text" id="idol" placeholder="例如：某某某"></div>
      <div><label for="date">預計活動日期</label><input type="date" id="date"></div>
    </div>
  </section>

  <section>
    <h2><span class="step">2</span>基本服務</h2>
    <p class="note">六項服務合計 5,000 元；取消勾選的項目會按比例扣除。勾選後可再細選內容。</p>
    <div id="services"></div>
  </section>

  <section>
    <h2><span class="step">3</span>印刷整合服務</h2>
    <p class="note" id="printdesc"></p>
    <h3>應援物</h3><div id="goods"></div>
    <h3>佈置物</h3><div id="decor"></div>
    <div id="printopts"></div>
  </section>

  <section>
    <h2><span class="step">4</span>視覺設計服務</h2>
    <p class="note" id="designdesc"></p>
    <div id="design"></div>
    <div id="designopts"></div>
    <label for="style">想要的風格</label>
    <input type="text" id="style" placeholder="例如：夢幻粉紫、復古底片、簡約可愛">
    <label for="colors">主色調／必放元素</label>
    <input type="text" id="colors" placeholder="例如：應援色、代表物、標語">
    <label for="ref">參考圖片連結</label>
    <input type="text" id="ref" placeholder="貼上雲端或社群連結">
    <label for="memo">其他說明</label>
    <textarea id="memo" rows="3" placeholder="尺寸、文字內容、特殊要求…"></textarea>
  </section>

  <section>
    <h2><span class="step">5</span>聯絡方式</h2>
    <input type="text" id="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px">
    <div class="grid">
      <div><label for="who">主辦人稱呼</label><input type="text" id="who"></div>
      <div><label for="contact">聯絡方式（IG／LINE／Email）</label><input type="text" id="contact"></div>
    </div>
  </section>

  <section>
    <h2>費用試算</h2>
    <table id="sum"></table>
    <p class="note">選項加價為示範數字，正式報價以我們確認後為準。印刷與設計費用加收一成服務費。</p>
    <button class="btn" style="background:var(--brand);color:var(--brand-ink);margin-top:8px" id="gen">產生訂單內容</button>
    <textarea class="out" id="out" readonly hidden></textarea>
    <button class="btn" style="background:var(--brand);color:var(--brand-ink);margin-top:8px" id="copy" hidden>複製訂單</button>
    <button class="btn" style="background:var(--brand);color:var(--brand-ink);margin-top:8px" id="send" hidden>送出訂單</button>
    <p class="note" id="msg"></p>
  </section>
</div>

<div class="bar"><div>預估總額<br><b id="total">NT$ 0</b></div><button class="btn" id="jump">看明細</button></div>

<script>
const $=id=>document.getElementById(id);
const fmt=n=>"NT$ "+Math.round(n).toLocaleString("en-US");
const plus=p=>p?"（+"+p.toLocaleString("en-US")+" 元）":"";
const st={on:{},opts:{},qty:{},design:{}};
let C=null;

function optBlock(scope,options,box){
  options.forEach(o=>{
    const key=scope+"."+o.id,fs=document.createElement("fieldset"),lg=document.createElement("legend");
    lg.textContent=o.label;fs.append(lg);
    st.opts[key]=o.type==="radio"?o.choices[0].v:o.choices.filter(c=>c.d).map(c=>c.v);
    o.choices.forEach((c,i)=>{
      const l=document.createElement("label"),inp=document.createElement("input");
      l.className="chip";inp.type=o.type==="radio"?"radio":"checkbox";inp.name=key;
      inp.checked=o.type==="radio"?i===0:!!c.d;
      inp.onchange=()=>{
        if(o.type==="radio")st.opts[key]=c.v;
        else{const s=new Set(st.opts[key]);inp.checked?s.add(c.v):s.delete(c.v);st.opts[key]=[...s]}
        calc();
      };
      l.append(inp,document.createTextNode(" "+c.v+plus(c.p)));fs.append(l);
    });
    box.append(fs);
  });
}
const picked=(scope,o)=>{const v=st.opts[scope+"."+o.id];return o.type==="radio"?[v]:v};
const optPrice=(scope,opts)=>opts.reduce((s,o)=>s+o.choices.filter(c=>picked(scope,o).includes(c.v)).reduce((a,c)=>a+c.p,0),0);
const optText=(scope,opts)=>opts.map(o=>o.label+"："+(picked(scope,o).join("、")||"無")).join("；");
const optMap=(scope,opts)=>Object.fromEntries(opts.map(o=>[o.id,st.opts[scope+"."+o.id]]));

function itemRows(id,list){
  list.forEach(([n,p,u,s])=>{
    st.qty[n]=0;
    const row=document.createElement("div");row.className="item";
    row.innerHTML='<div><div class="name"></div><div class="price"></div></div><div class="qty"><button type="button" aria-label="減少">−</button><input type="number" min="0" value="0" inputmode="numeric"><button type="button" aria-label="增加">＋</button></div>';
    row.querySelector(".name").textContent=n;
    row.querySelector(".price").textContent=p+" 元／"+u+"（每次增減 "+s+"）";
    const inp=row.querySelector("input"),[m,a]=row.querySelectorAll("button");
    inp.setAttribute("aria-label",n+"數量");
    const set=v=>{st.qty[n]=Math.max(0,parseInt(v)||0);inp.value=st.qty[n];calc()};
    m.onclick=()=>set(st.qty[n]-s);a.onclick=()=>set(st.qty[n]+s);inp.onchange=()=>set(inp.value);
    $(id).append(row);
  });
}

function initUI(){
  C.services.forEach(s=>{
    st.on[s.id]=true;
    const d=document.createElement("div"),head=document.createElement("label"),cb=document.createElement("input"),t=document.createElement("div"),b=document.createElement("b"),n=document.createElement("div"),ob=document.createElement("div");
    d.className="svc";head.className="chk";cb.type="checkbox";cb.checked=true;n.className="note";ob.className="opts";
    b.textContent=s.name;n.textContent=s.desc;t.append(b,n);head.append(cb,t);
    cb.onchange=()=>{st.on[s.id]=cb.checked;ob.hidden=!cb.checked;calc()};
    optBlock(s.id,s.options,ob);d.append(head,ob);$("services").append(d);
  });
  $("printdesc").textContent=C.print.desc;$("designdesc").textContent=C.design.desc;
  itemRows("goods",C.print.goods);itemRows("decor",C.print.decor);
  optBlock("print",C.print.options,$("printopts"));
  C.design.items.forEach(([n,p])=>{
    st.design[n]=false;
    const d=document.createElement("label"),cb=document.createElement("input"),t=document.createElement("div");
    d.className="chk";cb.type="checkbox";t.textContent=n+"　"+p.toLocaleString("en-US")+" 元";
    cb.onchange=()=>{st.design[n]=cb.checked;calc()};d.append(cb,t);$("design").append(d);
  });
  optBlock("design",C.design.options,$("designopts"));
}

function calc(){
  if(!C)return {total:0};
  const on=C.services.filter(s=>st.on[s.id]),baseT=Math.round(C.base*on.length/C.services.length);
  const svcOpt=on.reduce((a,s)=>a+optPrice(s.id,s.options),0);
  const items=[...C.print.goods,...C.print.decor];
  const goodsT=items.reduce((a,[n,p])=>a+p*st.qty[n],0),printOpt=goodsT?optPrice("print",C.print.options):0;
  const dSel=C.design.items.filter(([n])=>st.design[n]),dT=dSel.reduce((a,[,p])=>a+p,0),dOpt=dT?optPrice("design",C.design.options):0;
  const fee=Math.round((goodsT+printOpt+dT+dOpt)*C.fee),total=baseT+svcOpt+goodsT+printOpt+dT+dOpt+fee;
  const rows=[];
  if(on.length)rows.push(["基本服務（"+on.length+"／"+C.services.length+" 項）",baseT]);
  if(svcOpt)rows.push(["服務選項加購",svcOpt]);
  items.forEach(([n,p,u])=>{if(st.qty[n])rows.push([n+" × "+st.qty[n]+" "+u,p*st.qty[n]])});
  if(printOpt)rows.push(["印刷選項加購",printOpt]);
  dSel.forEach(([n,p])=>rows.push([n,p]));
  if(dOpt)rows.push(["設計選項加購",dOpt]);
  rows.push(["服務費（印刷＋設計 ×10%）",fee]);
  const t=$("sum");t.textContent="";
  rows.concat([["預估總額",total]]).forEach(([k,v],i,a)=>{
    const tr=t.insertRow(),c1=tr.insertCell(),c2=tr.insertCell();
    c1.textContent=k;c2.textContent=fmt(v);if(i===a.length-1)tr.className="tot";
  });
  $("total").textContent=fmt(total);
  return {total,on,items,dSel};
}

const val=id=>$(id).value.trim();
function makeOrder(){
  const items={};[...C.print.goods,...C.print.decor].forEach(([n])=>{if(st.qty[n])items[n]=st.qty[n]});
  const services={};C.services.forEach(s=>{services[s.id]={on:!!st.on[s.id],opts:optMap(s.id,s.options)}});
  return {idol:val("idol"),date:val("date"),who:val("who"),contact:val("contact"),style:val("style"),colors:val("colors"),ref:val("ref"),memo:val("memo"),website:val("website"),
    services,print:{items,opts:optMap("print",C.print.options)},
    design:{items:C.design.items.filter(([n])=>st.design[n]).map(([n])=>n),opts:optMap("design",C.design.options)}};
}
function orderText(r){
  const L=["【STARWISH 生咖訂單】","偶像／角色："+(val("idol")||"（未填）"),"活動日期："+(val("date")||"（未填）"),"主辦人："+(val("who")||"（未填）")+"　聯絡："+(val("contact")||"（未填）"),"","【基本服務】"];
  r.on.forEach(s=>L.push("- "+s.name+"："+optText(s.id,s.options)));
  if(!r.on.length)L.push("- 無");
  const it=r.items.filter(([n])=>st.qty[n]);
  if(it.length)L.push("","【印刷】"+it.map(([n,,u])=>n+" × "+st.qty[n]+u).join("、"),optText("print",C.print.options));
  if(r.dSel.length)L.push("","【設計】"+r.dSel.map(([n])=>n).join("、"),optText("design",C.design.options));
  [["風格","style"],["色調／元素","colors"],["參考連結","ref"],["說明","memo"]].forEach(([k,i])=>{if(val(i))L.push(k+"："+val(i))});
  L.push("","預估總額："+fmt(r.total));return L.join("\n");
}

$("gen").onclick=()=>{const o=$("out");o.value=orderText(calc());o.hidden=false;$("copy").hidden=false;$("msg").textContent="請複製訂單內容，傳給我們的官方帳號確認。"};
$("copy").onclick=()=>{
  const o=$("out");o.select();const ok=()=>$("msg").textContent="已複製，請貼給我們的官方帳號。";
  if(navigator.clipboard)navigator.clipboard.writeText(o.value).then(ok,()=>{document.execCommand("copy");ok()});
  else{document.execCommand("copy");ok()}
};
$("jump").onclick=()=>$("sum").scrollIntoView({behavior:"smooth",block:"center"});
$("send").onclick=async e=>{
  const b=e.currentTarget,m=$("msg");if(!C)return;
  const o=makeOrder(),r=calc();
  if(!o.idol||!o.who||!o.contact){m.textContent="請先填寫偶像名稱、主辦人稱呼與聯絡方式。";return}
  if(r.total<=0){m.textContent="請至少選擇一項服務或品項。";return}
  b.disabled=true;m.textContent="送出中…";
  try{
    const res=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(o)});
    const j=await res.json().catch(()=>({}));
    if(!res.ok)throw new Error(j.error||"伺服器錯誤");
    m.textContent="訂單已送出（編號 #"+j.id+"，預估總額 "+fmt(j.total)+"），我們會盡快與你聯絡確認細節。";
  }catch(err){
    m.textContent="送出失敗："+err.message+"。也可以按「產生訂單內容」複製後傳給我們。";b.disabled=false;
  }
};
